<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AGS Dashboard</title>
    <script src="https://go-echarts.github.io/go-echarts-assets/assets/echarts.min.js"></script>
    <script src="https://go-echarts.github.io/go-echarts-assets/assets/themes/westeros.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .chart { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Autonomous Gardening System Dashboard</h1>
        {{range .charts}}
        <div id="{{.ID}}" class="chart" style="width:100%;height:400px;" data-chart-json="{{.JSON}}"></div>
        <script>
            (function() {
                var container = document.getElementById('{{.ID}}');
                var chart = echarts.init(container, 'westeros');
                var option = JSON.parse(container.getAttribute('data-chart-json'));
                chart.setOption(option);
            })();
        </script>
        {{else}}
        <p style="text-align: center; color: #666;">No sensor data available yet.</p>
        {{end}}
    </div>
</body>
</html>
