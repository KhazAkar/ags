<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>AGS Dashboard</title>
        <link
            href="https://cdn.bokeh.org/bokeh/release/bokeh-3.8.0.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.8.0.min.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            .container {
                width: 80%;
                margin: auto;
                overflow: hidden;
                padding: 20px;
                background: #fff;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .plot-container {
                margin-bottom: 20px;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 5px;
                background-color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="container">
            {% for div, script in bokeh_divs | zip(bokeh_scripts) %}
            <div class="plot-container">
                {{ div | safe }} {{ script | safe }}
            </div>
            {% endfor %}
        </div>
    </body>
</html>
