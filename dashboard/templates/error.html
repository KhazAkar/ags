<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>AGS Dashboard - Error</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            .container {
                width: 80%;
                margin: auto;
                overflow: hidden;
                padding: 20px;
                background: #fff;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .error {
                color: #d32f2f;
                background-color: #ffebee;
                padding: 15px;
                border-radius: 5px;
                border-left: 5px solid #d32f2f;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>AGS Dashboard</h1>
            <div class="error">
                <h2>Error</h2>
                <p>{{.error}}</p>
            </div>
        </div>
    </body>
</html>
