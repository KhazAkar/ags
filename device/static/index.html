<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Garden Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🌱</span>
                    <h1>Garden Dashboard</h1>
                </div>
                <div class="header-actions">
                    <theme-toggle id="themeToggle"></theme-toggle>
                    <status-indicator id="systemStatus" status="idle" message="Connecting to system..."></status-indicator>
                </div>
            </div>
        </header>

        <main class="dashboard">
            <section class="sensors-grid">
                <sensor-card id="airTempCard" title="Air Temperature" icon="🌡️" unit="°C"></sensor-card>
                <sensor-card id="airHumidityCard" title="Air Humidity" icon="💧" unit="%"></sensor-card>
                <sensor-card id="soilTempCard" title="Soil Temperature" icon="🌡️" unit="°C"></sensor-card>
                <sensor-card id="soilMoistureCard" title="Soil Moisture" icon="🌱" unit="%"></sensor-card>
                <sensor-card id="lightLevelCard" title="Light Level" icon="☀️" unit="lx"></sensor-card>
                <sensor-card id="systemHealthCard" title="System Health" icon="💚" unit="%"></sensor-card>
            </section>

            <section class="controls-section">
                <h2 class="section-title">Controls</h2>
                <div class="controls-grid">
                    <control-button id="toggleLights" icon="💡">Lights Off</control-button>
                    <control-button id="toggleFans" icon="🌬️">Fans Off</control-button>
                    <control-button id="waterPlants" icon="🚿">Water Plants</control-button>
                </div>
            </section>

            <section class="activity-section">
                <h2 class="section-title">Recent Activity</h2>
                <div class="activity-log" id="activityLog">
                    <!-- Activity items will be added here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Web Components -->
    <script src="js/components/SensorCard.js" type="module"></script>
    <script src="js/components/ControlButton.js" type="module"></script>
    <script src="js/components/StatusIndicator.js" type="module"></script>
    <script src="js/components/ThemeToggle.js" type="module"></script>
    
    <!-- Main App -->
    <script src="js/app.js" type="module"></script>
</body>
</html>
