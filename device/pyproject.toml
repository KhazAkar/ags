[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ags-device"
version = "0.1.0"
description = "Autonomous Gardening System Device Backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "falcon>=4.0.2",
    "paho-mqtt>=2.1.0",
    "SQLAlchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "RPi.GPIO>=0.7.0",
    "smbus2>=0.4.0",
    "w1thermsensor>=2.0.0",
    "Adafruit-Blinka>=8.0.0",
    "adafruit-circuitpython-bme280>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.11.8",
    "uvicorn>=0.34.2",
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "I"]
ignore = ["E501"]

[project.scripts]
ags-device = "app.main:main"
